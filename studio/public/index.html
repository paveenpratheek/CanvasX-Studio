<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="studio-token" content="%%TOKEN%%">
<meta name="studio-boot" content="%%BOOT%%">
<title>CanvasX Studio</title>
<link rel="icon" href="/studio/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/studio/studio.css">
</head>
<body>
<header class="bar">
  <div class="brand"><img src="/studio/icon.svg" alt="" width="22" height="22"><span>CanvasX Studio</span></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Pages"></nav>
  <div class="pins" id="pins" aria-label="Pinned conversations" hidden></div>
  <div class="right">
    <div class="engines" id="engines" aria-label="Engines"></div>
    <button class="btn" id="setup-btn" type="button" title="The folders, the embedding model and the phone, step by step">Setup</button>
    <a class="btn" id="canvasx" target="_blank" rel="noopener" title="CanvasX opens in a tab of its own, where it can open your workspace folder">Open CanvasX <span aria-hidden="true">↗</span></a>
  </div>
</header>
<main id="frames"></main>

<section class="setup" id="setup" hidden aria-label="Setup">
  <button class="btn setup-close" id="setup-close" type="button" title="Close the setup; the Setup button opens it again">Close</button>
  <div class="setup-card" id="setup-card"></div>
</section>

<dialog id="logs" aria-labelledby="logs-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="logs-title">Engine</h2>
      <span class="state" id="logs-state"></span>
      <span class="grow"></span>
      <button class="btn" id="logs-restart" type="button">Restart</button>
      <button class="btn" id="logs-stop" type="button">Stop</button>
      <button class="btn" id="logs-close" type="button" aria-label="Close">Close</button>
    </div>
    <p class="detail" id="logs-detail"></p>
    <pre id="logs-lines" tabindex="0"></pre>
  </div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="/studio/studio.js"></script>
</body>
</html>
